# KIND cluster for the llap profile: 1 control-plane + 5 workers.
#
# Node names (cluster name "desktop"):
#   desktop-control-plane, desktop-worker, desktop-worker2, … desktop-worker5
#
# The last two workers are labeled node-role.kubernetes.io/llap at join time so
# llapdaemon pods prefer dedicated hosts (see overlays/llap/llapdaemon/kustomization.yaml).
#
# Create:
#   kind create cluster --name desktop --config kind/llap-cluster.yaml
#
# Hue: control-plane extraPortMappings expose NodePort 30888 at http://localhost:8888
#
# Requires Docker Desktop (or similar) with enough RAM/disk for llap (see README).

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: desktop
nodes:
  - role: control-plane
    extraPortMappings:
      # Hue NodePort (30888) → http://localhost:8888 on the host
      - containerPort: 30888
        hostPort: 8888
        protocol: TCP
  - role: worker
  - role: worker
  - role: worker
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "node-role.kubernetes.io/llap="
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "node-role.kubernetes.io/llap="
