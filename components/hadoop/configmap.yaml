apiVersion: v1
kind: ConfigMap
metadata:
  name: hadoop-setup
  namespace: default
  labels:
    app: hadoop
data:
  bashrc: |
    #
    # Hadoop environment
    #
    export JAVA_HOME=/usr/lib/jvm/jre
    export HADOOP_HOME=/opt/hadoop
    #EOF

  core-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <?xml-stylesheet type="text/xsl" href="configuration.xsl"?>
    <configuration>
       <property>
          <name>fs.defaultFS</name>
          <value>hdfs://nameservice:8020</value>
       </property>
       <property>
          <name>hadoop.proxyuser.hive.hosts</name>
          <value>*</value>
       </property>
       <property>
          <name>hadoop.proxyuser.hive.groups</name>
          <value>*</value>
       </property>
       <property>
          <name>fs.s3a.endpoint</name>
          <value></value>
       </property>
       <property>
          <name>fs.s3a.access.key</name>
          <value></value>
       </property>
       <property>
          <name>fs.s3a.secret.key</name>
          <value></value>
       </property>
    </configuration>

  hdfs-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <?xml-stylesheet type="text/xsl" href="configuration.xsl"?>
    <configuration>
       <property>
          <name>dfs.replication</name>
          <value>1</value>
       </property>
       <property>
          <name>dfs.namenode.rpc-bind-host</name>
          <value>0.0.0.0</value>
       </property>
       <property>
          <name>hadoop.tmp.dir</name>
          <value>/hdfs</value>
       </property>
       <!-- Audited only at DEBUG level: the liveness probe lists every directory every 30 seconds -->
       <property>
          <name>dfs.namenode.audit.log.debug.cmdlist</name>
          <value>getfileinfo,listStatus</value>
       </property>
    </configuration>

  mapred-site.xml: |
    <?xml version="1.0"?>
    <?xml-stylesheet type="text/xsl" href="configuration.xsl"?>
    <configuration>
       <property>
          <name>mapred.job.tracker</name>
          <value>nameservice:9001</value>
       </property>
    </configuration>

  hadoop-env.sh: |
    #
    # HADOOP Environment
    #
    export JAVA_HOME=/usr/lib/jvm/jre
    export HADOOP_HOME=/opt/hadoop
    export HADOOP_HEAPSIZE=1024m
    # On the volume, so the logs survive container restarts for post mortems
    export HADOOP_LOG_DIR=/hdfs/logs
    #EOF

  centos-vault.repo: |
    [vault-base]
    name=CentOS 7.9.2009 - Base (vault)
    baseurl=https://vault.centos.org/7.9.2009/os/$basearch/
            https://archive.kernel.org/centos-vault/7.9.2009/os/$basearch/
            https://mirror.nsc.liu.se/centos-store/7.9.2009/os/$basearch/
    gpgcheck=1
    gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7
    enabled=0

    [vault-updates]
    name=CentOS 7.9.2009 - Updates (vault)
    baseurl=https://vault.centos.org/7.9.2009/updates/$basearch/
            https://archive.kernel.org/centos-vault/7.9.2009/updates/$basearch/
            https://mirror.nsc.liu.se/centos-store/7.9.2009/updates/$basearch/
    gpgcheck=1
    gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7
    enabled=0

    [vault-extras]
    name=CentOS 7.9.2009 - Extras (vault)
    baseurl=https://vault.centos.org/7.9.2009/extras/$basearch/
            https://archive.kernel.org/centos-vault/7.9.2009/extras/$basearch/
            https://mirror.nsc.liu.se/centos-store/7.9.2009/extras/$basearch/
    gpgcheck=1
    gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7
    enabled=0

  root-tasks.sh: |
    #!/bin/bash
    #
    # ROOT Tasks
    #
    function retry(){
     local attempts="$1"
     local delay="$2"
     local attempt=1
     shift 2

     until "$@"; do
      if [ "${attempt}" -ge "${attempts}" ]; then
       echo "Command failed after ${attempts} attempts: $*"
       return 1
      fi
      echo "Attempt ${attempt}/${attempts} failed: $*"
      sleep "${delay}"
      attempt=$((attempt + 1))
     done
    }
    #
    # Install only from the CentOS 7 vault repos, which list fallback mirrors. The image's
    # EPEL 7 repo is archived and its mirror lookup fails intermittently, failing the whole install.
    # The RPMs are kept on the hadoop volume, so only the first start of a new volume downloads them.
    # shellcheck disable=SC2329
    function installPackages(){
     local packages="less vi vim lsof openssh-server openssh-clients sshpass hostname bind-utils iputils nmap-ncat"
     local cache=/hdfs/rpm-cache
     if [ "$(cat "${cache}/packages.list" 2>/dev/null)" = "${packages}" ] &&
        yum -y --disablerepo='*' localinstall "${cache}"/*.rpm; then
      return 0
     fi
     rm -rf "${cache}"
     mkdir -p "${cache}"
     yum --disablerepo='*' --enablerepo='vault-*' clean all >/dev/null
     # shellcheck disable=SC2086
     yum -y --disablerepo='*' --enablerepo='vault-*' --setopt=skip_missing_names_on_install=False \
      --downloadonly --downloaddir="${cache}" install ${packages} &&
      yum -y --disablerepo='*' localinstall "${cache}"/*.rpm &&
      echo "${packages}" > "${cache}/packages.list"
    }
    #
    {
     sed -i.bak 's/mirrorlist/#mirrorlist/g' /etc/yum.repos.d/CentOS-*
     sed -i 's|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/CentOS-*
     cp /hadoop/centos-vault.repo /etc/yum.repos.d/centos-vault.repo
     # Neither the startup nor the probes use these tools, so they install in the background
     # at the lowest priority, leaving the CPU to the starting daemons and the probes
     (
      renice -n 19 -p "${BASHPID}" >/dev/null
      ionice -c 3 -p "${BASHPID}"
      if retry 5 20 installPackages >/var/log/package-install.log 2>&1; then
       echo "Packages installed"
      else
       echo "Package install failed, last lines of /var/log/package-install.log:"
       tail -n 20 /var/log/package-install.log
      fi
     ) &
     echo "root:${ROOT_PASSWORD}" | chpasswd
     echo "hadoop:${HADOOP_PASSWORD}" | chpasswd
     if getent group supergroup >/dev/null; then
      echo "supergroup group already exists"
     else
      groupadd supergroup
     fi
     if getent passwd hive >/dev/null; then
      echo "hive user already exists"
     else
      useradd -G supergroup hive
     fi
     echo "hive:${HIVE_PASSWORD}" | chpasswd
     host_name="$(hostname)"
     sed -i --copy "s/${host_name}/${host_name}\tnameservice/g" /etc/hosts
    }
    exit $?
    #EOF

  hdfs-ready.sh: |
    #!/bin/bash
    #
    # HDFS is ready: NameNode out of safe mode with a live DataNode, RPC and data ports open.
    # Reads the NameNode's JMX page; the hdfs CLI would start a JVM on every probe.
    #
    jmx="http://127.0.0.1:9870/jmx?qry=Hadoop:service=NameNode,name="
    curl -sf --max-time 5 "${jmx}NameNodeInfo" | grep -q '"Safemode" : ""' || exit 1
    curl -sf --max-time 5 "${jmx}FSNamesystemState" | grep -q '"NumLiveDataNodes" : [1-9]' || exit 1
    nc -z -w 2 127.0.0.1 8020 && nc -z -w 2 127.0.0.1 9866
    #EOF

  setup.sh: |
    #!/bin/bash
    #
    # Setup the OS/Hadoop environment
    #
    function showLogs(){
      local daemon="$1"
      tail -n 40 "${HADOOP_LOG_DIR}"/*-"${daemon}"-*.log "${HADOOP_LOG_DIR}"/*-"${daemon}"-*.out
    }
    #
    sudo env ROOT_PASSWORD="${ROOT_PASSWORD}" HADOOP_PASSWORD="${HADOOP_PASSWORD}" HIVE_PASSWORD="${HIVE_PASSWORD}" /hadoop/root-tasks.sh || exit 1
    export HADOOP_HOME=/opt/hadoop
    cp --backup=numbered /hadoop/bashrc          ${HADOOP_HOME}/.bashrc
    cp --backup=numbered /hadoop/core-site.xml   ${HADOOP_HOME}/etc/hadoop/core-site.xml
    cp --backup=numbered /hadoop/hdfs-site.xml   ${HADOOP_HOME}/etc/hadoop/hdfs-site.xml
    cp --backup=numbered /hadoop/mapred-site.xml ${HADOOP_HOME}/etc/hadoop/mapred-site.xml
    cp --backup=numbered /hadoop/hadoop-env.sh   ${HADOOP_HOME}/etc/hadoop/hadoop-env.sh
    # shellcheck source=/dev/null
    . "${HADOOP_HOME}/etc/hadoop/hadoop-env.sh"
    format_check=$(find /hdfs/dfs/name -mindepth 1 -print -quit)
    if [ -n "${format_check}" ]; then
      echo "HDFS already formatted"
    else
      echo "Formatting HDFS"
      ${HADOOP_HOME}/bin/hadoop namenode -format
    fi
    #
    # Start each daemon locally: start-all.sh reaches them over SSH and reports success even when SSH fails.
    # YARN stays configured but isn't started, since Tez runs inside HiveServer2.
    # To bring it back, add "yarn resourcemanager" "yarn nodemanager" to the list.
    daemons=("hdfs namenode" "hdfs datanode" "hdfs secondarynamenode")
    for daemon in "${daemons[@]}"; do
      read -r cli name <<< "${daemon}"
      if ! "${HADOOP_HOME}/bin/${cli}" --daemon start "${name}"; then
        echo "Failed to start the ${name}"
        showLogs "${name}"
        exit 1
      fi
    done
    if ! timeout 300 bash -c 'until /hadoop/hdfs-ready.sh; do sleep 5; done'; then
         echo "HDFS did not come up within 5 minutes"
         showLogs namenode
         showLogs datanode
         exit 1
    elif [ -n "${format_check}" ]; then
         echo "Hadoop started successfully, HDFS already formatted"     
    else
         echo "Hadoop started successfully, initializing HDFS directories for Hive"
         hdfs dfs -mkdir -p /tmp/hive /users/hive /warehouse/tablespace/managed/hive /warehouse/tablespace/external/hive
         hdfs dfs -chmod 777 / /tmp
         hdfs dfs -chown -R hive:supergroup /tmp/hive /users/hive /warehouse
    fi
    #
    # Without a handler, PID 1 ignores SIGTERM and the daemons are killed when the grace period ends.
    # Stop them in reverse order instead. Set only now, so it can't cut the format or the HDFS setup short.
    function stopDaemons(){
      local index cli name
      for (( index = ${#daemons[@]} - 1; index >= 0; index-- )); do
        read -r cli name <<< "${daemons[index]}"
        "${HADOOP_HOME}/bin/${cli}" --daemon stop "${name}"
      done
      exit 0
    }
    trap stopDaemons TERM
    # In the background so the handler runs at once; the container stays up for post mortems
    sleep infinity &
    wait "$!"
    #EOF
