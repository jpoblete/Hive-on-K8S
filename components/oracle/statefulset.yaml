# Oracle Database 23ai Free, one pod. Image from container-registry.oracle.com (requires the
# oracle-registry pull secret; accept the license on the registry first). Pinned to 23.9.0.0-amd64.
# Oracle's "database" for Trino is a schema under a user: bigdata (see components/oracle/setup).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oracle
  namespace: default
  labels:
    app: oracle
spec:
  replicas: 1
  serviceName: oracle
  selector:
    matchLabels:
      app: oracle
  template:
    metadata:
      labels:
        app: oracle
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: oracle-registry
      securityContext:
        fsGroup: 54321
      containers:
      - name: oracle
        image: container-registry.oracle.com/database/free:23.9.0.0-amd64
        env:
        - name: ORACLE_PWD
          valueFrom:
            secretKeyRef:
              name: hive-credentials
              key: oracle-password
        - name: ORACLE_CHARACTERSET
          value: AL32UTF8
        ports:
        - containerPort: 1521
          name: oracle
        startupProbe:
          exec:
            command: ["/bin/bash", "-c", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s / as sysdba | grep -q 1"]
          periodSeconds: 30
          failureThreshold: 80
        readinessProbe:
          tcpSocket:
            port: 1521
          periodSeconds: 15
          failureThreshold: 3
        volumeMounts:
        - name: oracle-data
          mountPath: /opt/oracle/oradata
        resources:
          requests:
            cpu: "1"
            memory: 4Gi
          limits:
            cpu: "2"
            memory: 8Gi
  volumeClaimTemplates:
  - metadata:
      name: oracle-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 20Gi
