apiVersion: v1
kind: ConfigMap
metadata:
  name: hivemetastore
  namespace: default
  labels:
    app: hivemetastore

data:
  core-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <?xml-stylesheet type="text/xsl" href="configuration.xsl"?>
    <configuration>
       <property>
          <name>fs.defaultFS</name>
          <value>hdfs://nameservice:8020</value>
       </property>
       <property>
          <name>hadoop.proxyuser.hive.hosts</name>
          <value>*</value>
       </property>
       <property>
          <name>hadoop.proxyuser.hive.groups</name>
          <value>*</value>
       </property>
       <property>
          <name>fs.s3a.endpoint</name>
          <value></value>
       </property>
       <property>
          <name>fs.s3a.access.key</name>
          <value></value>
       </property>
       <property>
          <name>fs.s3a.secret.key</name>
          <value></value>
       </property>
    </configuration>

  hive-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <?xml-stylesheet type="text/xsl" href="configuration.xsl"?>
    <configuration>
       <property>
          <name>mapred.job.tracker</name>
          <value>local</value>
       </property>
       <property>
          <name>hive.metastore.warehouse.dir</name>
          <value>/warehouse/tablespace/managed/hive</value>
       </property>
       <property>
          <name>hive.metastore.warehouse.external.dir</name>
          <value>/warehouse/tablespace/external/hive</value>
       </property>
       <property>
          <name>metastore.partition.management.table.types</name>
          <value>MANAGED_TABLE,EXTERNAL_TABLE</value>
       </property>
       <property>
          <name>hive.metastore.uris</name>
          <value>thrift://hivemetastore.default.svc.cluster.local:9083</value>
       </property>
       <property>
          <name>datanucleus.schema.autoCreateTables</name>
          <value>true</value>
       </property>
       <property>
          <name>hive.jar.directory</name>
          <value>/opt/hive/lib</value>
       </property>
       <property>
        <name>hive.exec.scratchdir</name>
          <value>/tmp/hive/scratch_dir</value>
       </property>
       <property>
          <name>hive.user.install.directory</name>
          <value>/opt/hive/install_dir</value>
       </property>
       <property>
          <name>hive.execution.engine</name>
          <value>tez</value>
       </property>
       <property>
          <name>tez.local.mode</name>
          <value>true</value>
       </property>
       <property>
          <name>tez.runtime.optimize.local.fetch</name>
          <value>true</value>
       </property>
       <property>
          <name>hive.tez.exec.inplace.progress</name>
          <value>false</value>
       </property>
       <property>
          <name>hive.tez.exec.print.summary</name>
          <value>true</value>
       </property>
    </configuration>

  hive-env.sh: |
    # Licensed to the Apache Software Foundation (ASF) under one
    # or more contributor license agreements.  See the NOTICE file
    # distributed with this work for additional information
    # regarding copyright ownership.  The ASF licenses this file
    # to you under the Apache License, Version 2.0 (the
    # "License"); you may not use this file except in compliance
    # with the License.  You may obtain a copy of the License at
    #
    #     http://www.apache.org/licenses/LICENSE-2.0
    #
    # Unless required by applicable law or agreed to in writing, software
    # distributed under the License is distributed on an "AS IS" BASIS,
    # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
    # See the License for the specific language governing permissions and
    # limitations under the License.
    
    # Set Hive and Hadoop environment variables here. These variables can be used
    # to control the execution of Hive. It should be used by admins to configure
    # the Hive installation (so that users do not have to set environment variables
    # or set command line parameters to get correct behavior).
    
    # Set HADOOP_HOME to point to a specific hadoop install directory
    export HADOOP_HOME=/opt/hadoop
    
    # Hive Configuration Directory can be controlled by:
    export HIVE_CONF_DIR=/opt/hive/conf
    
    # Folder containing extra libraries required for hive compilation/execution can be controlled by:
    # export HIVE_AUX_JARS_PATH=
    
    # HIVE Log Directory can be controlled by the following and ensure it exists on the filesystem:
    export HIVE_LOG_DIR=/opt/hive/log
    
    # The hive service being invoked (beeline etc.) is available via the environment
    # variable SERVICE
    
    # Hive Client memory usage can be an issue if a large number of clients
    # are running at the same time. The flags below have been useful in
    # reducing memory usage:
    
    if [ "$SERVICE" = "beeline" ]; then
       if [ -z "$DEBUG" ]; then
          export HADOOP_CLIENT_OPTS="$HADOOP_CLIENT_OPTS -Xms128m -XX:MaxHeapFreeRatio=40 -XX:MinHeapFreeRatio=15 -XX:+UseG1GC -XX:-UseGCOverheadLimit"
       else
          export HADOOP_CLIENT_OPTS="$HADOOP_CLIENT_OPTS -Xms128m -XX:MaxHeapFreeRatio=40 -XX:MinHeapFreeRatio=15 -XX:-UseGCOverheadLimit"
       fi
    fi
    
    # The heap size of the jvm stared by hive shell script can be controlled via:
    #
    export HADOOP_HEAPSIZE=2048
    #
    # Larger heap size may be required when running queries over large number of files or partitions.
    # By default hive shell scripts use a heap size of 256 (MB).  Larger heap size would also be
    # appropriate for hive server.
    
    if [ "$SERVICE" = "metastore" ]; then
       hive_log_file="hive${SERVICE}-$(hostname -f)-$(date +%s).log"
       export HADOOP_CLIENT_OPTS="$HADOOP_CLIENT_OPTS -Dhive.log.dir=$HIVE_LOG_DIR -Dhive.log.file=${hive_log_file} \
         -Dlog4j.configurationFile=$HIVE_CONF_DIR/hive-log4j2.properties -XX:+UseG1GC \
         -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=$HIVE_LOG_DIR \
         -Xlog:gc*=info:file=$HIVE_LOG_DIR/gc-${SERVICE}-%p-%t.log:time,uptime,level,tags:filecount=5,filesize=16M"
    fi
    #
    if [ "$SERVICE" = "hiveserver2" ]; then
       hive_log_file="${SERVICE}-$(hostname -f)-$(date +%s).log"
       export HADOOP_CLIENT_OPTS="$HADOOP_CLIENT_OPTS -Dhive.log.dir=$HIVE_LOG_DIR \
         -Dhive.log.file=${hive_log_file} -Dlog4j.configurationFile=$HIVE_CONF_DIR/hive-log4j2.properties \
         -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=$HIVE_LOG_DIR \
         -Xlog:gc*=info:file=$HIVE_LOG_DIR/gc-${SERVICE}-%p-%t.log:time,uptime,level,tags:filecount=5,filesize=16M"
    fi
    #
    # runLlapDaemon.sh reads its settings only from the environment and, unlike bin/hive,
    # adds neither the Hadoop classpath nor the JDK 17+ --add-opens flags.
    if [ "$SERVICE" = "llapdaemon" ]; then
       export LLAP_DAEMON_HOME=/opt/hive
       export LLAP_DAEMON_CONF_DIR=$HIVE_CONF_DIR
       export LLAP_DAEMON_LOG_DIR=$HIVE_LOG_DIR
       export LLAP_DAEMON_HEAPSIZE=${LLAP_DAEMON_HEAPSIZE:-3072}
       export LLAP_LOG4J2_PROPERTIES_FILE_NAME=llap-daemon-log4j2.properties
       LLAP_DAEMON_USER_CLASSPATH="$($HADOOP_HOME/bin/hadoop classpath)"
       export LLAP_DAEMON_USER_CLASSPATH
       export LLAP_DAEMON_OPTS="$LLAP_DAEMON_OPTS --add-opens java.base/java.nio=ALL-UNNAMED --add-opens java.base/java.net=ALL-UNNAMED \
         --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED \
         --add-opens java.base/java.util.concurrent=ALL-UNNAMED --add-opens java.base/java.util.concurrent.atomic=ALL-UNNAMED \
         --add-opens java.base/java.util.regex=ALL-UNNAMED --add-opens java.base/java.lang.reflect=ALL-UNNAMED \
         --add-opens java.base/java.io=ALL-UNNAMED -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=$HIVE_LOG_DIR"
    fi
    #EOF

  bash_profile: |
    #
    # Hive Environment Setup
    #
    if [ -f ~/.bashrc ]; then
       # shellcheck source=/dev/null
       . ~/.bashrc
    fi
    #EOF


  bashrc: |
    #
    # Hive Environment Variables
    #
    export JAVA_HOME=/opt/java/openjdk
    export HIVE_HOME=/opt/hive
    export HIVE_CONF_DIR=/opt/hive/conf
    export HADOOP_CONF_DIR=/opt/hive/conf
    export PATH=${PATH}:/opt/hive/conf:/opt/hive/bin:/opt/hadoop/bin:.
    BEELINE_URL="jdbc:hive2://$(hostname -f):10000/default"
    export BEELINE_URL
    export BEELINE_USER="${BEELINE_USER:-hive}"
    if [ -f ~/.beeline.env ]; then
       # shellcheck source=/dev/null
       . ~/.beeline.env
    fi
    alias beeline='beeline -u "${BEELINE_URL}" -n "${BEELINE_USER:-hive}" -p "${BEELINE_PASSWORD:-}"'
    #EOF

  staging.sh: |
    #!/bin/bash
    #
    # STAGING
    #
    function retry(){
       local attempts="$1"
       local delay="$2"
       local attempt=1
       shift 2

       until "$@"; do
          if [ "${attempt}" -ge "${attempts}" ]; then
             echo "Command failed after ${attempts} attempts: $*"
             return 1
          fi
          echo "Attempt ${attempt}/${attempts} failed: $*"
          sleep "${delay}"
          attempt=$((attempt + 1))
       done
    }
    #
    function staging(){
       #
       # Installing OS packages
       #
       retry 5 10 microdnf -y install less vi vim lsof openssh-server openssh-clients sshpass hostname bind-utils iputils nmap-ncat || return 1
       retry 5 10 rpm -ivh https://dev.mysql.com/get/Downloads/Connector-J/mysql-connector-j-26.7.0-1.el9.noarch.rpm || return 1
       echo "root:${ROOT_PASSWORD}" | chpasswd
       echo "hive:${HIVE_PASSWORD}" | chpasswd
       usermod -s /bin/bash hive
       ssh-keygen -A
       exec /usr/sbin/sshd -D &
       #
       # Setting up Hive
       #
       mkdir -p /home/hive/.ssh
       mkdir -p "${HIVE_HOME}/log"
       mkdir -p "${HIVE_HOME}/custom"
       mkdir -p "${HIVE_HOME}/install_dir"
       mkdir -p "${HIVE_HOME}/data/warehouse"
       cp "${HIVE_HOME}"/setup/*.xml "${HIVE_HOME}/conf/"
       cp "${HIVE_HOME}/setup/hive-env.sh" "${HIVE_HOME}/conf/"
       cp "${HIVE_HOME}/setup/bashrc" /home/hive/.bashrc
       cp "${HIVE_HOME}/setup/bash_profile" /home/hive/.bash_profile
       if [ -n "${BEELINE_PASSWORD:-}" ]; then
          printf 'export BEELINE_PASSWORD=%q\n' "${BEELINE_PASSWORD}" > /home/hive/.beeline.env
          chmod 600 /home/hive/.beeline.env
       fi
       # Overrides the bashrc default, this pod's own HiveServer2
       if [ -n "${BEELINE_URL:-}" ]; then
          printf 'export BEELINE_URL=%q\n' "${BEELINE_URL}" >> /home/hive/.beeline.env
       fi
       if [ -n "${HIVE_METASTORE_PASSWORD:-}" ]; then
          sed -i "s/__HIVE_METASTORE_PASSWORD__/${HIVE_METASTORE_PASSWORD}/g" "${HIVE_HOME}/conf/hive-site.xml"
       fi
       if [ "${SERVICE}" = "hiveserver2" ] && [ -f "${HIVE_HOME}/setup/createTable.sh" ]; then
          cp "${HIVE_HOME}/setup/createTable.sh" "${HIVE_HOME}/bin/createTable.sh"
          chmod +x "${HIVE_HOME}/bin/createTable.sh"
       fi
       if [ -f "${HIVE_HOME}/setup/hdfs-log-sync.sh" ]; then
          cp "${HIVE_HOME}/setup/hdfs-log-sync.sh" "${HIVE_HOME}/bin/hdfs-log-sync.sh"
          chmod +x "${HIVE_HOME}/bin/hdfs-log-sync.sh"
       fi
       chown -R hive:hive /home/hive "${HIVE_HOME}" 2>/dev/null || true
       return 0
       
    }
    staging
    exit $?
    #EOF

  start-hive.sh: |
    #!/bin/bash
    set -x
    #
    # START HIVE
    #
    function startHive(){
       #
       # CORRECT ENV VARS
       #
       [ -z "${TEZ_HOME}"    ] && export TEZ_HOME=/opt/tez
       [ -z "${HIVE_HOME}"   ] && export HIVE_HOME=/opt/hive
       [ -z "${JAVA_HOME}"   ] && export JAVA_HOME=/opt/java/openjdk
       [ -z "${HADOOP_HOME}" ] && export HADOOP_HOME=/opt/hadoop
       cd "${HIVE_HOME}" || exit 1
       [ ! -d "${HIVE_HOME}/.local/bin" ] && mkdir -p "${HIVE_HOME}/.local/bin"
       env | awk '/_PORT/ && /=tcp:\/\// {gsub(/tcp:\/\/.*:/,"");print $0}' | while IFS= read -r i; do
           echo "Correcting: ${i}"
           export "${i?}"
       done
       env
       #
       # Setup SSH Keys & passwordless login
       #
       ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_rsa
       sshpass -p "${HIVE_PASSWORD}" ssh-copy-id -o StrictHostKeyChecking=no localhost
       #
       # Link TEZ JARs
       #
       for tezPath in "${TEZ_HOME}"/*.jar; do
           [ -e "${tezPath}" ] || continue
           tezJar="${tezPath##*/}"
           [ ! -e "${HIVE_HOME}/lib/${tezJar}" ] && ln -s "${tezPath}" "${HIVE_HOME}/lib/${tezJar}"
       done
       ln -s /usr/share/java/mysql-connector-java.jar "${HIVE_HOME}/lib/mysql-connector-java.jar"
       #
       # INITIALIZE & START HIVE SERVICE
       #
       cd "${HIVE_HOME}" || exit 1
       ln -s "${HIVE_HOME}/conf/hive-log4j2.properties" "${HIVE_HOME}/conf/log4j.properties"
       if [ "${SERVICE}" == "metastore" ]; then
          echo "Initializing ${SERVICE^} schema as user: $(whoami)"
          "${HIVE_HOME}/bin/schematool" -dbType mysql -initOrUpgradeSchema
       fi
       if [ "${SERVICE}" == "llapdaemon" ]; then
          [ ! -e "${HIVE_HOME}/conf/llap-daemon-log4j2.properties" ] && cp "${HIVE_HOME}/conf/llap-daemon-log4j2.properties.template" "${HIVE_HOME}/conf/llap-daemon-log4j2.properties"
          # shellcheck source=/dev/null
          . "${HIVE_HOME}/conf/hive-env.sh"
       fi
       #
       # Optional HDFS log archive (llap HiveServer2 / LLAP when HIVE_LOG_HDFS_BASE is set)
       #
       hdfs_log_sync="${HIVE_HOME}/bin/hdfs-log-sync.sh"
       if [ -n "${HIVE_LOG_HDFS_BASE:-}" ] && [ -f "${hdfs_log_sync}" ]; then
          "${hdfs_log_sync}" restore || true
          "${hdfs_log_sync}" start-periodic &
          hdfs_log_sync_periodic_pid=$!
          trap '"${hdfs_log_sync}" push' TERM INT
       fi
       #
       # Start Hive Service
       #
       id
       env
       echo "Starting ${SERVICE^} as user: $(whoami)"
       if [ "${SERVICE}" == "llapdaemon" ]; then
          "${HIVE_HOME}/scripts/llap/bin/runLlapDaemon.sh" run >& "${HIVE_HOME}/log/${SERVICE}-${HOSTNAME}-$(date +%s).log" &
       else
          "${HIVE_HOME}/bin/hive" --service "${SERVICE}" >& "${HIVE_HOME}/log/${SERVICE/metastore/hivemetastore}-${HOSTNAME}-$(date +%s).log" &
       fi
       service_pid=$!
       wait "${service_pid}"
       status=$?
       if [ -n "${HIVE_LOG_HDFS_BASE:-}" ] && [ -f "${hdfs_log_sync}" ]; then
          "${hdfs_log_sync}" push || true
          if [ -n "${hdfs_log_sync_periodic_pid:-}" ]; then
             kill "${hdfs_log_sync_periodic_pid}" 2>/dev/null || true
          fi
       fi
       echo "${status}"
       return "${status}"
    }
    #
    # Execute Hive
    #
    if [ "$(whoami)" == "root" ]; then
       /opt/hive/setup/staging.sh || exit 1
       exec su -s /bin/bash -c "export SERVICE=${SERVICE}; export HIVE_PASSWORD=${HIVE_PASSWORD:-}; export HIVE_METASTORE_PASSWORD=${HIVE_METASTORE_PASSWORD:-}; export BEELINE_PASSWORD=${BEELINE_PASSWORD:-}; export LLAP_DAEMON_HEAPSIZE=${LLAP_DAEMON_HEAPSIZE:-}; /opt/hive/setup/start-hive.sh" - hive
    else
       startHive
    fi
    #EOF
