apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - statefulset.yaml
  - service.yaml
configMapGenerator:
  - name: hivemetastore
    behavior: merge
    files:
      - createTable.sh=createTable.sh
generatorOptions:
  disableNameSuffixHash: true
#EOF  

