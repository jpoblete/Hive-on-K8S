apiVersion: v1
kind: Service
metadata:
  labels:
    app: hivemetastore
  name: hivemetastore
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: hivemetastore
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
  - port: 9083
    targetPort: 9083
    name: thrift
    protocol: TCP
