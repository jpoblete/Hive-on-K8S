apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: warehouse
resources:
  - serviceaccount.yaml
  - service.yaml
  - statefulset.yaml
configMapGenerator:
  - name: cassandra-config
    options:
      disableNameSuffixHash: true
    files:
      - cassandra.yaml=cassandra.yaml
      - cassandra-rackdc.properties=cassandra-rackdc.properties
  - name: kerberos-client
    options:
      disableNameSuffixHash: true
    files:
      - krb5.conf=../krb5.conf
generatorOptions:
  disableNameSuffixHash: true
