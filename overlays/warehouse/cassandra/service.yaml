# Headless service gives each Cassandra pod a stable DNS name (gossip + seeds).
apiVersion: v1
kind: Service
metadata:
  name: cassandra-headless
  namespace: warehouse
  labels:
    app: cassandra
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: cassandra
  ports:
    - name: cql
      port: 9042
      targetPort: 9042
    - name: intra
      port: 7000
      targetPort: 7000
---
apiVersion: v1
kind: Service
metadata:
  name: cassandra
  namespace: warehouse
  labels:
    app: cassandra
spec:
  selector:
    app: cassandra
  ports:
    - name: cql
      port: 9042
      targetPort: 9042
