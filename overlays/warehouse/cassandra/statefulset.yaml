apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  namespace: warehouse
  labels:
    app: cassandra
spec:
  serviceName: cassandra-headless
  replicas: 3
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      serviceAccountName: cassandra
      automountServiceAccountToken: false
      setHostnameAsFQDN: true
      securityContext:
        fsGroup: 999
      terminationGracePeriodSeconds: 120
      containers:
        - name: cassandra
          image: jpoblete73/cassandra-kerberos:4.1.12
          ports:
            - name: cql
              containerPort: 9042
            - name: intra
              containerPort: 7000
            - name: jmx
              containerPort: 7199
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CASSANDRA_CLUSTER_NAME
              value: warehouse
            - name: CASSANDRA_SEEDS
              value: cassandra-0.cassandra-headless.warehouse.svc.cluster.local
            - name: MAX_HEAP_SIZE
              value: 1024M
            - name: HEAP_NEWSIZE
              value: 256M
            - name: KRB5_CONFIG
              value: /etc/krb5.conf
          readinessProbe:
            exec:
              command: ["/bin/bash", "-ec", "nodetool status | grep -q '^UN'"]
            initialDelaySeconds: 60
            # nodetool takes ~1s (JVM startup); the default 1s timeout always fails.
            timeoutSeconds: 10
            periodSeconds: 20
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 9042
            initialDelaySeconds: 120
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/cassandra
            - name: cassandra-config
              mountPath: /etc/cassandra/cassandra.yaml
              subPath: cassandra.yaml
            - name: cassandra-config
              mountPath: /etc/cassandra/cassandra-rackdc.properties
              subPath: cassandra-rackdc.properties
            - name: kerberos-config
              mountPath: /etc/krb5.conf
              subPath: krb5.conf
              readOnly: true
            - name: kerberos-keytabs
              mountPath: /etc/cassandra/keytab
              readOnly: true
      volumes:
        - name: cassandra-config
          configMap:
            name: cassandra-config
        - name: kerberos-config
          configMap:
            name: kerberos-client
            items:
              - key: krb5.conf
                path: krb5.conf
        - name: kerberos-keytabs
          secret:
            secretName: kerberos-keytabs
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
