# Ranger Admin. Opt-in: HIVECTL_SECURE_RANGER=1 ./hiveCtl.sh start secure
# NodePort 30680 is inside the gateway HAProxy range (30000-32767).
# Browser login URL: HIVECTL_RANGER_EXTERNAL_URL (default http://127.0.0.1:6080 for kubectl port-forward).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: warehouse
resources:
  - mysql-init-job.yaml
  - ../../../components/ranger
patches:
  - path: statefulset-init.yaml
  - path: statefulset-hadoop-conf.yaml
  - path: statefulset-startup.yaml
  - path: statefulset-log-volume.yaml
  - patch: |-
      - op: replace
        path: /metadata/namespace
        value: warehouse
    target:
      kind: ServiceAccount
      name: ranger
  - patch: |-
      - op: replace
        path: /metadata/namespace
        value: warehouse
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30680
    target:
      kind: Service
      name: ranger
  - patch: |-
      - op: replace
        path: /metadata/namespace
        value: warehouse
    target:
      kind: Service
      name: ranger-headless
  - patch: |-
      - op: replace
        path: /metadata/namespace
        value: warehouse
    target:
      kind: ConfigMap
      name: ranger
  - patch: |-
      - op: replace
        path: /metadata/namespace
        value: warehouse
    target:
      kind: StatefulSet
      name: ranger
#EOF
