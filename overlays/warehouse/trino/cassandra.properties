# Cassandra catalog -> the trino datacenter (RF=1, PasswordAuthenticator, mutual TLS).
# The trino role (trino@WAREHOUSE.LAB) credentials are appended at startup from the
# cassandra-pw-trino Secret; the client keystore/truststore come from trino-cassandra-tls.
connector.name=cassandra
cassandra.contact-points=cassandra-trino-headless.warehouse.svc.cluster.local
cassandra.native-protocol-port=9042
cassandra.load-policy.dc-aware.local-dc=trino
cassandra.security=PASSWORD
cassandra.tls.enabled=true
cassandra.tls.keystore-path=/etc/trino/cassandra-tls/keystore.jks
cassandra.tls.truststore-path=/etc/trino/cassandra-tls/truststore.jks
