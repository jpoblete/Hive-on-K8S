# Cassandra catalog -> the password-only node (cassandra-pw). The Kerberos ring stays Kerberos-only.
# username/password are injected at startup from the cassandra-pw-trino Secret (never stored in config).
connector.name=cassandra
cassandra.contact-points=cassandra-pw-headless.warehouse.svc.cluster.local
cassandra.native-protocol-port=9042
cassandra.load-policy.dc-aware.local-dc=datacenter1
cassandra.security=PASSWORD
