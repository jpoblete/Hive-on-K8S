# PostgreSQL catalog -> database "bigdata" on the warehouse postgres pod.
# Unlike the MySQL connector, the PostgreSQL connector requires the database in the JDBC URL.
# The trino role password is appended at startup from the hive-credentials Secret (postgres-trino-password).
connector.name=postgresql
connection-url=jdbc:postgresql://postgres.warehouse.svc.cluster.local:5432/bigdata
connection-user=trino
