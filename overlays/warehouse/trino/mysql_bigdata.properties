# MySQL catalog -> the warehouse MySQL pod. The database is selected by the Trino schema name
# (mysql_bigdata.<schema>), so the JDBC URL must NOT include a database name.
# The trino MySQL user password is appended at startup from the hive-credentials Secret (mysql-trino-password).
connector.name=mysql
connection-url=jdbc:mysql://mysql.warehouse.svc.cluster.local:3306
connection-user=trino
