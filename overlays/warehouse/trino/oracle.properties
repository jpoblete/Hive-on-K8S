# Oracle catalog -> application PDB FREEPDB1 on the warehouse oracle pod. The Oracle JDBC driver is
# already bundled in trinodb/trino:484. The schema bigdata (owned by user BIGDATA) is what Trino sees.
# The trino user password is appended at startup from the hive-credentials Secret (oracle-trino-password).
connector.name=oracle
connection-url=jdbc:oracle:thin:@oracle.warehouse.svc.cluster.local:1521/FREEPDB1
connection-user=trino
