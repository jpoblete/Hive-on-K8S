# Ranger 2.4 JISQL (Java 8) connects without allowPublicKeyRetrieval; enable legacy auth plugin for rangeradmin.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  template:
    spec:
      containers:
        - name: mysql
          args:
            - --mysql-native-password=ON
          # Quick fix: make the osSetup.sh postStart hook non-fatal. A failed or slow
          # first-boot microdnf install must not kill mysqld (FailedPostStartHook -> restart).
          lifecycle:
            postStart:
              exec:
                command: ["/bin/bash", "-c", "/bin/bash /docker-entrypoint-initdb.d/osSetup.sh || echo 'osSetup.sh postStart failed (non-fatal)'; exit 0"]
#EOF
