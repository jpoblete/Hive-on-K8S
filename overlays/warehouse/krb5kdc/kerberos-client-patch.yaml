# warehouse KDC client config: point clients at krb5kdc.warehouse (not secure).
apiVersion: v1
kind: ConfigMap
metadata:
  name: kerberos-client
  labels:
    app: krb5kdc
data:
  krb5.conf: |
    [libdefaults]
        default_realm = WAREHOUSE.LAB
        dns_lookup_kdc = true
        dns_lookup_realm = false
        rdns = false
        ticket_lifetime = 24h
        forwardable = true
        udp_preference_limit = 1

    [realms]
        WAREHOUSE.LAB = {
            kdc = krb5kdc.warehouse.svc.cluster.local:88
            admin_server = krb5kdc.warehouse.svc.cluster.local:749
            default_domain = warehouse.lab
        }

    [domain_realm]
        .warehouse.svc.cluster.local = WAREHOUSE.LAB
        warehouse.svc.cluster.local = WAREHOUSE.LAB
        .warehouse.lab = WAREHOUSE.LAB
        warehouse.lab = WAREHOUSE.LAB
