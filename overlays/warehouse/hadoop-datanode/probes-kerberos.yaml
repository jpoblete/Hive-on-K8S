apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hadoop-datanode
spec:
  template:
    spec:
      containers:
        - name: hadoop-datanode
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - nc -z -w 2 "$(hostname -f)" 9866
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - nc -z -w 2 "$(hostname -f)" 9866
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - nc -z -w 2 "$(hostname -f)" 9866
