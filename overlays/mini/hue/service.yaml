apiVersion: v1
kind: Service
metadata:
  name: hue-headless
  namespace: mini
  labels:
    app: hue
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: hue
  ports:
    - name: http
      port: 8888
      targetPort: 8888
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: hue
  namespace: mini
  labels:
    app: hue
spec:
  type: NodePort
  selector:
    app: hue
  ports:
    - name: http
      port: 8888
      targetPort: 8888
      nodePort: 30887
      protocol: TCP
