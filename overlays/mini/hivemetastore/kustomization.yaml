apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:  
  - serviceaccount.yaml
  - ../../../base
#
# Namespace adjustments
#
patches:  
  - patch: |-
      - op: replace
        path: /metadata/namespace
        value: mini
    target:
      name: hivemetastore

configMapGenerator:
  - name: hivemetastore
    behavior: merge
    files:
      - hive-site.xml=hive-site.xml
