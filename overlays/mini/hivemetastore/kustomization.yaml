apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:  
  - serviceaccount.yaml
  - headless-service.yaml
  - ../../../base
#
# Namespace adjustments
#
patches:  
  - patch: |-
      - op: replace
        path: /metadata/namespace
        value: mini
    target:
      name: hivemetastore
  # Pod DNS hivemetastore-0.hivemetastore-headless for the housekeeping leader
  - patch: |-
      - op: add
        path: /spec/serviceName
        value: hivemetastore-headless
    target:
      kind: StatefulSet
      name: hivemetastore

configMapGenerator:
  - name: hivemetastore
    behavior: merge
    files:
      - hive-site.xml=hive-site.xml
