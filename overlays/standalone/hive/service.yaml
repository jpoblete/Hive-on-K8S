apiVersion: v1
kind: Service
metadata:
  name: hive
  namespace: standalone
  labels:
    app: hive
spec:
  clusterIP: None
  selector:
    app: hive
---
apiVersion: v1
kind: Service
metadata:
  name: hivemetastore
  namespace: standalone
  labels:
    app: hive
    component: hivemetastore
spec:
  publishNotReadyAddresses: true
  type: ClusterIP
  selector:
    app: hive
  ports:
    - name: thrift
      port: 9083
      targetPort: 9083
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: hiveserver2
  namespace: standalone
  labels:
    app: hive
    component: hiveserver2
spec:
  type: NodePort
  selector:
    app: hive
  ports:
    - name: binary
      port: 10000
      targetPort: 10000
      nodePort: 31000
      protocol: TCP
    - name: http
      port: 10001
      targetPort: 10001
      nodePort: 31001
      protocol: TCP
    - name: webui
      port: 10002
      targetPort: 10002
      nodePort: 31002
      protocol: TCP
