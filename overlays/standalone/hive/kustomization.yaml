apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: standalone
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - pvc.yaml
  - configmap.yaml
  - service.yaml
  - statefulset.yaml
configMapGenerator:
  - name: hive
    behavior: merge
    files:
      - createTable.sh=../../../base/createTable.sh
generatorOptions:
  disableNameSuffixHash: true
