apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-derby
  namespace: standalone
  labels:
    app: hive
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
