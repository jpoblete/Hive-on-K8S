apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
spec:
  template:
    spec:
      setHostnameAsFQDN: true
      containers:
        - name: zookeeper
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KRB5_CONFIG
              value: /etc/krb5.conf
            - name: KRB5_REALM
              value: SECURE.LAB
            - name: ZOO_CFG_EXTRA
              value: "authProvider.1=org.apache.zookeeper.server.auth.SASLAuthenticationProvider requireClientAuthScheme=sasl kerberos.removeHostFromPrincipal=true kerberos.removeRealmFromPrincipal=true"
            - name: JVMFLAGS
              value: "-Djava.security.auth.login.config=/etc/krb5/jaas.conf -Dzookeeper.authProvider.1=org.apache.zookeeper.server.auth.SASLAuthenticationProvider"
          command:
            - /bin/bash
            - -ec
            - |
              fqdn="$(hostname -f)"
              realm="${KRB5_REALM:-SECURE.LAB}"
              pod="${POD_NAME:?}"
              mkdir -p /etc/krb5
              install -o zookeeper -g zookeeper -m 400 "/var/kerberos/incoming/${pod}.keytab" /etc/krb5/zookeeper.keytab
              sed "s|__PRINCIPAL__|zookeeper/${fqdn}@${realm}|g" /config/jaas.conf > /etc/krb5/jaas.conf
              chmod 400 /etc/krb5/jaas.conf
              chown zookeeper:zookeeper /etc/krb5/jaas.conf /etc/krb5/zookeeper.keytab
              exec /docker-entrypoint.sh zkServer.sh start-foreground
          volumeMounts:
            - name: kerberos-config
              mountPath: /etc/krb5.conf
              subPath: krb5.conf
              readOnly: true
            - name: kerberos-keytabs
              mountPath: /var/kerberos/incoming
              readOnly: true
            - name: zookeeper-krb
              mountPath: /config
              readOnly: true
      volumes:
        - name: kerberos-config
          configMap:
            name: kerberos-client
            items:
              - key: krb5.conf
                path: krb5.conf
        - name: kerberos-keytabs
          secret:
            secretName: kerberos-keytabs
            defaultMode: 0400
        - name: zookeeper-krb
          configMap:
            name: zookeeper-krb
            defaultMode: 0444
