# Phase 1: run setup + Tomcat only (skip create-ranger-services.py demo bootstrap).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ranger
spec:
  template:
    spec:
      containers:
        - name: ranger
          env:
            - name: RANGER_SUPPORTED_COMPONENTS
              value: hive,hdfs
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              RANGER_HOME=/opt/ranger
              RANGER_LOG_DIR="${RANGER_HOME}/ranger-2.4.0-admin/ews/logs"
              RANGER_LOG_MAX_BYTES=$((512 * 1024 * 1024))
              trim_ranger_admin_logs() {
                local f=""
                mkdir -p "${RANGER_LOG_DIR}"
                find "${RANGER_LOG_DIR}" -maxdepth 1 -type f -name 'ranger-admin-*.log' -size +"${RANGER_LOG_MAX_BYTES}c" -print0 2>/dev/null \
                  | while IFS= read -r -d '' f; do
                      echo "[ranger] Truncating oversized admin log: ${f}"
                      truncate -s 0 "${f}" || rm -f "${f}"
                    done
              }
              trim_ranger_admin_logs
              if [ ! -f "${RANGER_HOME}/.setupDone" ]; then
                cd "${RANGER_HOME}/admin"
                if ! ./setup.sh; then
                  echo "Ranger setup.sh failed; see ${RANGER_HOME}/admin/logfile"
                  exit 1
                fi
                touch "${RANGER_HOME}/.setupDone"
              fi
              supported="${RANGER_SUPPORTED_COMPONENTS:-hive,hdfs}"
              conf_dir="${RANGER_HOME}/admin/ews/webapp/WEB-INF/classes/conf"
              for admin_site in "${conf_dir}/ranger-admin-site.xml" "${conf_dir}/ranger-admin-default-site.xml"; do
                if [ -f "${admin_site}" ]; then
                  sed -i "/ranger.supportedcomponents/{n;s|<value[^>]*>.*</value>|<value>${supported}</value>|;s|<value />|<value>${supported}</value>|;}" "${admin_site}"
                fi
              done
              cd "${RANGER_HOME}/admin"
              ./ews/ranger-admin-services.sh start
              pid="$(ps -ef | grep -v grep | grep 'org.apache.ranger.server.tomcat.EmbeddedServer' | awk '{print $2}')"
              if [ -z "${pid}" ]; then
                echo "Ranger Admin JVM did not start; see ews/logs/catalina.out"
                exit 1
              fi
              (
                while kill -0 "${pid}" 2>/dev/null; do
                  sleep 3600
                  trim_ranger_admin_logs
                done
              ) &
              tail --pid="${pid}" -f /dev/null
          startupProbe:
            httpGet:
              path: /login.jsp
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /login.jsp
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /login.jsp
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 6
#EOF
