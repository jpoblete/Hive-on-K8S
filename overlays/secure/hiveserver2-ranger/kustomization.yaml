# Phase 2: HS2 with Ranger authorizer (requires hive-on-k8s/hive-ranger image). Opt-in: HIVECTL_SECURE_RANGER_HS2=1
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../hiveserver2
patches:
  - path: statefulset-image.yaml
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RANGER_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hive-credentials
              key: ranger-admin-password
    target:
      kind: StatefulSet
      name: hiveserver2
configMapGenerator:
  - name: hivemetastore
    behavior: merge
    files:
      - hive-site-ranger-addon.xml
      - ranger-hive-security.xml
      - ranger-hive-policymgr-ssl.xml
      - ranger-hive-audit.xml
#EOF
