# TCP probes on 10000 look like failed Beeline clients (Socket closed by peer during SASL).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hivemetastore
spec:
  template:
    spec:
      containers:
        - name: hivemetastore
          startupProbe:
            $patch: replace
            exec:
              command:
                - /bin/bash
                - -ec
                - grep -qE ':2710 ' /proc/net/tcp6 /proc/net/tcp
            periodSeconds: 5
            failureThreshold: 720
          readinessProbe:
            $patch: replace
            exec:
              command:
                - /bin/bash
                - -ec
                - grep -qE ':2710 ' /proc/net/tcp6 /proc/net/tcp
            periodSeconds: 10
            failureThreshold: 3
