apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: secure
resources:
  - serviceaccount.yaml
  - configmap.yaml
  - statefulset.yaml
  - service.yaml
configMapGenerator:
  - name: hue-hive-conf
    options:
      disableNameSuffixHash: true
    files:
      - hive-site.xml=hive-site.xml
