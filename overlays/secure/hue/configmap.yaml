apiVersion: v1
kind: ConfigMap
metadata:
  name: hue
  namespace: secure
  labels:
    app: hue
data:
  init-hue-db.sh: |
    #!/bin/bash
    set -euo pipefail
    host="${MYSQL_HOST:-mysql.secure.svc.cluster.local}"
    port="${MYSQL_PORT:-3306}"
    echo "Waiting for MySQL at ${host}:${port} ..."
    for i in $(seq 1 120); do
      if mysqladmin ping -h "${host}" -P "${port}" -uroot -p"${MYSQL_ROOT_PASSWORD}" --silent 2>/dev/null; then
        break
      fi
      sleep 2
    done
    mysql -h "${host}" -P "${port}" -uroot -p"${MYSQL_ROOT_PASSWORD}" <<EOF
    CREATE DATABASE IF NOT EXISTS hue CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE USER IF NOT EXISTS 'hue'@'%' IDENTIFIED BY '${HUE_MYSQL_PASSWORD}';
    ALTER USER 'hue'@'%' IDENTIFIED BY '${HUE_MYSQL_PASSWORD}';
    GRANT ALL PRIVILEGES ON hue.* TO 'hue'@'%';
    FLUSH PRIVILEGES;
    EOF
    echo "Hue database ready."
  setup-hue-kerberos.sh: |
    #!/bin/bash
    set -euo pipefail
    [ "${HUE_KERBEROS:-0}" = "1" ] || exit 0
    pod="${POD_NAME:-hue-0}"
    realm="${KRB5_REALM:-SECURE.LAB}"
    kt_dir="/usr/share/hue/desktop/conf"
    src="/var/kerberos/incoming/${pod}.keytab"
    host="$(hostname -f)"
    case "${host}" in
      *.${KUBERNETES_CLUSTER_DOMAIN:-svc.cluster.local}) ;;
      *)
        host="${pod}.hue-headless.secure.svc.cluster.local"
        ;;
    esac
    if [ "$(id -u)" = "0" ]; then
      pod_ip="$(hostname -I 2>/dev/null | awk '{print $1}')"
      short="$(hostname -s)"
      if [ -n "${pod_ip}" ] && ! grep -q "[[:space:]]${host}[[:space:]]" /etc/hosts 2>/dev/null; then
        echo "${pod_ip} ${host} ${short}" >> /etc/hosts
      fi
    fi
    export HUE_KEYTAB_PATH="${kt_dir}/hue.service.keytab"
    export HUE_KERBEROS_PRINCIPAL="hue/${host}@${realm}"
    export HS2_KERBEROS_HOST="${HS2_KERBEROS_HOST:-hiveserver2-0.hiveserver2-headless.secure.svc.cluster.local}"
    export HDFS_NN_HOST="${HDFS_NN_HOST:-nameservice.secure.svc.cluster.local}"
    export KRB5CCNAME="${kt_dir}/krb5cc"
    if [ ! -f "${HUE_KEYTAB_PATH}" ]; then
      [ "$(id -u)" = "0" ] || { echo "missing ${HUE_KEYTAB_PATH} and not root"; exit 1; }
      [ -f "${src}" ] || { echo "missing Kerberos keytab ${src}"; exit 1; }
      install -o 1001 -g 1000 -m 400 "${src}" "${HUE_KEYTAB_PATH}"
    fi
    kinit -kt "${HUE_KEYTAB_PATH}" "${HUE_KERBEROS_PRINCIPAL}"
    touch "${KRB5CCNAME}"
    chown 1001:1000 "${KRB5CCNAME}" "${HUE_KEYTAB_PATH}" 2>/dev/null || true
    chmod 600 "${KRB5CCNAME}" 2>/dev/null || true
  render-hue-ini.sh: |
    #!/bin/bash
    set -euo pipefail
    conf_dir="/usr/share/hue/desktop/conf"
    mkdir -p "${conf_dir}"
    # shellcheck source=/config/setup-hue-kerberos.sh
    . /config/setup-hue-kerberos.sh || exit 1
    host="${HUE_KERBEROS_PRINCIPAL#hue/}"
    host="${host%@*}"
    realm="${KRB5_REALM:-SECURE.LAB}"
    export HUE_KEYTAB_PATH="${HUE_KEYTAB_PATH:-/usr/share/hue/desktop/conf/hue.service.keytab}"
    export HUE_KERBEROS_PRINCIPAL="${HUE_KERBEROS_PRINCIPAL:-hue/${host}@${realm}}"
    export HS2_KERBEROS_HOST="${HS2_KERBEROS_HOST:-hiveserver2-0.hiveserver2-headless.secure.svc.cluster.local}"
    export HDFS_NN_HOST="${HDFS_NN_HOST:-nameservice.secure.svc.cluster.local}"
    sed \
      -e "s|__HUE_MYSQL_PASSWORD__|${HUE_MYSQL_PASSWORD}|g" \
      -e "s|__HUE_SECRET_KEY__|${HUE_SECRET_KEY}|g" \
      -e "s|__HUE_KEYTAB__|${HUE_KEYTAB_PATH:-/var/lib/hue/kerberos/hue.service.keytab}|g" \
      -e "s|__HUE_KERBEROS_PRINCIPAL__|${HUE_KERBEROS_PRINCIPAL}|g" \
      -e "s|__HS2_HOST__|${HS2_KERBEROS_HOST:-hiveserver2-0.hiveserver2-headless.secure.svc.cluster.local}|g" \
      -e "s|__HDFS_NN_HOST__|${HDFS_NN_HOST:-nameservice.secure.svc.cluster.local}|g" \
      /config/hue.ini.template > "${conf_dir}/hue.ini"
    if [ "$(id -u)" = "0" ]; then
      chown 1001:1000 "${conf_dir}/hue.ini" "${HUE_KEYTAB_PATH}" 2>/dev/null || true
    fi
  hue-migrate.sh: |
    #!/bin/bash
    set -euo pipefail
    /config/render-hue-ini.sh
    cd /usr/share/hue
    ./build/env/bin/hue migrate --noinput
  entrypoint.sh: |
    #!/bin/bash
    set -euo pipefail
    # startup.sh runs migrate then supervisor; migrate leaves a supervisor that
    # Gunicorn cleanup kills. Schema is migrated in init; run supervisor only.
    export KRB5CCNAME=/usr/share/hue/desktop/conf/krb5cc
    /config/render-hue-ini.sh
    cd /usr/share/hue
    exec ./build/env/bin/supervisor
  hue.ini.template: |
    [desktop]
    secret_key=__HUE_SECRET_KEY__
    http_host=0.0.0.0
    http_port=8888
    use_allowed_hosts=false
    app_blacklist=search,hbase,oozie,pig,sqoop,zookeeper,security,spark,jobbrowser,impala

    [[kerberos]]
    hue_keytab=__HUE_KEYTAB__
    hue_principal=__HUE_KERBEROS_PRINCIPAL__
    kinit_path=/usr/bin/kinit
    ccache_path=/usr/share/hue/desktop/conf/krb5cc
    krb5_renewlifetime_enabled=false
    keytab_reinit_frequency=3600

    [[database]]
    engine=mysql
    host=mysql.secure.svc.cluster.local
    port=3306
    user=hue
    password=__HUE_MYSQL_PASSWORD__
    name=hue

    [hadoop]
    [[hdfs_clusters]]
    [[[default]]]
    fs_defaultfs=hdfs://nameservice:8020
    webhdfs_url=https://__HDFS_NN_HOST__:9871/webhdfs/v1
    ssl_cert_ca_verify=false
    security_enabled=true
    mechanism=GSSAPI
    supergroup=supergroup
    home_dir=/user/admin

    [beeswax]
    hive_server_host=__HS2_HOST__
    hive_server_port=10000
    hive_conf_dir=/usr/share/hue/desktop/conf/hive
    security_enabled=true
    use_sasl=true
    mechanism=GSSAPI
    server_conn_timeout=120
    list_partitions_limit=10000
    close_queries=open

    [notebook]
    enable_all_interpreters=false
    interpreters_shown_on_wheel=hive
    [[interpreters]]
    [[[hive]]]
    name=Hive
    interface=hiveserver2
