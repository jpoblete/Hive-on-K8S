apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-hdfs-nn
  namespace: secure
  labels:
    app: hadoop-namenode
spec:
  storageClassName: hive-on-k8s-local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
