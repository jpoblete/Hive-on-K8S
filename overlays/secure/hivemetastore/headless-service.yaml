apiVersion: v1
kind: Service
metadata:
  name: hivemetastore-headless
  namespace: secure
  labels:
    app: hivemetastore
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: hivemetastore
  ports:
    - port: 9083
      targetPort: 9083
      name: thrift
      protocol: TCP
